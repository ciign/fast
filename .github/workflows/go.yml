name: FAST CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write   # release job uploads assets

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: fast-server/go.mod
          cache-dependency-path: fast-server/go.sum

      - name: Vet
        working-directory: ./fast-server
        run: go vet ./...

      - name: Test
        working-directory: ./fast-server
        run: go test -v -race -count=1 ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: fast-server/go.mod
          cache-dependency-path: fast-server/go.sum

      - name: Build
        working-directory: ./fast-server
        env:
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "${{ matrix.os }}" = "windows" ]; then ext=".exe"; fi
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -trimpath -ldflags="-s -w" \
            -o fast-server-${{ matrix.os }}-${{ matrix.arch }}${ext} .

      # v3 of the artifact actions was shut off by GitHub (the reason every run
      # since 2026-03 failed at "Set up job"); v4 needs unique names per upload.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fast-server-${{ matrix.os }}-${{ matrix.arch }}
          path: fast-server/fast-server-${{ matrix.os }}-${{ matrix.arch }}*
          if-no-files-found: error

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fast-server-*
          generate_release_notes: true
